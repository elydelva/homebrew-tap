name: Validate formulae

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frame:
    name: frame / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          core: false
          cask: false
      - name: Validate generator
        run: ruby scripts/update-frame.test.rb
      - name: Register checked-out tap
        run: brew tap elydelva/tap "$GITHUB_WORKSPACE"
      - name: Validate formula syntax and style
        run: |
          ruby -c Formula/frame.rb
          brew audit --strict --formula elydelva/tap/frame
      - name: Install and test frame
        run: |
          brew install --formula elydelva/tap/frame
          brew test elydelva/tap/frame
          test "$(frame --version)" = "$(ruby -e 'puts File.read("Formula/frame.rb")[/version "([^"]+)"/, 1]')"
